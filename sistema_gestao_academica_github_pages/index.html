<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Acadêmica</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="assets/img/logo-senai.png" alt="Logo SENAI" class="logo">
            <img src="assets/img/logo-sesi.png" alt="Logo SESI" class="logo">
        </div>
        <h1>Sistema de Gestão Acadêmica</h1>
    </header>

    <main class="main-content">
        <section class="card-container">
            <div class="card">
                <h2>Acesso do Aluno</h2>
                <p>Consulte notas, frequência e agenda de aulas.</p>
                <button onclick="alert('Área em desenvolvimento!')">Acessar</button>
            </div>
            <div class="card">
                <h2>Acesso do Professor</h2>
                <p> Lançamento de notas, faltas e diário de classe.</p>
                <button onclick="alert('Área em desenvolvimento!')">Acessar</button>
            </div>
        </section>
        <div class="side-img">
            <img src="assets/img/foto-canto.png" alt="Ilustração">
        </div>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
