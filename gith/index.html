<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Académica - SENAI/SESI</title>
    <style>
        /* CSS Integrado e Estilo Padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        header {
            background-color: #0056b3;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        .logos img {
            height: 35px;
            margin-left: 10px;
        }

        .content {
            padding: 30px;
        }

        /* Formulários */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="password"], input[type="email"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #003d80;
        }

        /* Tabelas */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
        }

        /* Navegação e Alertas */
        nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        nav button {
            background-color: #6c757d;
        }

        nav button.active {
            background-color: #0056b3;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Sistema de Gestão Académica</h1>
        <div class="logos">
            <img src="assets/img/logo-senai.png" alt="SENAI" onerror="this.style.display='none'">
            <img src="assets/img/logo-sesi.png" alt="SESI" onerror="this.style.display='none'">
        </div>
    </header>

    <div class="content">
        <!-- Notificações -->
        <div id="alert-box" class="alert"></div>

        <!-- Tela de Login -->
        <div id="view-login">
            <h2 style="margin-bottom: 20px;">Iniciar Sessão</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Utilizador:</label>
                    <input type="text" id="usuario" required placeholder="Digite 'admin'">
                </div>
                <div class="form-group">
                    <label for="senha">Palavra-passe:</label>
                    <input type="password" id="senha" required placeholder="Digite '123'">
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- Dashboard / Painel Principal (Oculto antes do login) -->
        <div id="view-dashboard" class="hidden">
            <nav>
                <button id="btn-tab-admins" class="active" onclick="switchTab('admins')">Administradores</button>
                <button id="btn-tab-cadastros" onclick="switchTab('cadastros')">Cadastros</button>
                <button onclick="logout()" style="background-color: #dc3545; margin-left: auto;">Sair</button>
            </nav>

            <!-- Aba Administradores -->
            <div id="tab-admins">
                <h3>Gestão de Administradores</h3>
                <form id="adminForm" style="margin-top: 15px;">
                    <div class="form-group">
                        <label for="admin-nome">Nome Completo:</label>
                        <input type="text" id="admin-nome" required>
                    </div>
                    <div class="form-group">
                        <label for="admin-email">E-mail:</label>
                        <input type="email" id="admin-email" required>
                    </div>
                    <button type="submit">Adicionar Administrador</button>
                </form>

                <h4 style="margin-top: 25px;">Lista de Administradores</h4>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-admins-body">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Aba Cadastros Geral -->
            <div id="tab-cadastros" class="hidden">
                <h3>Cadastros Gerais</h3>
                <p style="margin-top: 10px;">Módulo de gestão de turmas, alunos e instrutores ativo no localStorage.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Inicialização da "Base de Dados" local (localStorage)
    function initDB() {
        if (!localStorage.getItem('sys_admins')) {
            const defaultAdmins = [
                { id: 1, nome: 'Administrador Principal', email: 'admin@senaisesi.br' }
            ];
            localStorage.setItem('sys_admins', JSON.stringify(defaultAdmins));
        }
    }

    // Alertas do Sistema
    function showAlert(msg, isSuccess = true) {
        const box = document.getElementById('alert-box');
        box.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'}`;
        box.innerText = msg;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 3000);
    }

    // Login (Substitui autenticação PHP)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('usuario').value;
        const pass = document.getElementById('senha').value;

        if (user === 'admin' && pass === '123') {
            sessionStorage.setItem('authenticated', 'true');
            loadDashboard();
            showAlert('Login efetuado com sucesso!');
        } else {
            showAlert('Utilizador ou palavra-passe incorretos!', false);
        }
    });

    // Encerrar Sessão
    function logout() {
        sessionStorage.removeItem('authenticated');
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('view-login').classList.remove('hidden');
        document.getElementById('loginForm').reset();
        showAlert('Sessão encerrada.');
    }

    // Controlo do Dashboard
    function loadDashboard() {
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-dashboard').classList.remove('hidden');
        renderAdmins();
    }

    // Troca de Abas
    function switchTab(tab) {
        document.getElementById('tab-admins').classList.add('hidden');
        document.getElementById('tab-cadastros').classList.add('hidden');
        document.getElementById('btn-tab-admins').classList.remove('active');
        document.getElementById('btn-tab-cadastros').classList.remove('active');

        if (tab === 'admins') {
            document.getElementById('tab-admins').classList.remove('hidden');
            document.getElementById('btn-tab-admins').classList.add('active');
        } else if (tab === 'cadastros') {
            document.getElementById('tab-cadastros').classList.remove('hidden');
            document.getElementById('btn-tab-cadastros').classList.add('active');
        }
    }

    // Operações CRUD - Administradores
    function renderAdmins() {
        const admins = JSON.parse(localStorage.getItem('sys_admins') || '[]');
        const tbody = document.getElementById('table-admins-body');
        tbody.innerHTML = '';

        admins.forEach(admin => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${admin.id}</td>
                <td>${admin.nome}</td>
                <td>${admin.email}</td>
                <td>
                    <button onclick="deleteAdmin(${admin.id})" style="background-color: #dc3545; padding: 5px 10px; font-size: 0.8rem;">Remover</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('adminForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const nome = document.getElementById('admin-nome').value;
        const email = document.getElementById('admin-email').value;

        const admins = JSON.parse(localStorage.getItem('sys_admins') || '[]');
        const newAdmin = {
            id: admins.length ? admins[admins.length - 1].id + 1 : 1,
            nome: nome,
            email: email
        };

        admins.push(newAdmin);
        localStorage.setItem('sys_admins', JSON.stringify(admins));
        this.reset();
        renderAdmins();
        showAlert('Administrador adicionado com sucesso!');
    });

    function deleteAdmin(id) {
        let admins = JSON.parse(localStorage.getItem('sys_admins') || '[]');
        admins = admins.filter(a => a.id !== id);
        localStorage.setItem('sys_admins', JSON.stringify(admins));
        renderAdmins();
        showAlert('Administrador removido com sucesso!');
    }

    // Inicialização ao carregar a página
    window.onload = function() {
        initDB();
        if (sessionStorage.getItem('authenticated') === 'true') {
            loadDashboard();
        }
    };
</script>

</body>
</html>
