<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Académica - SENAI/SESI</title>
    <!-- Vinculação ao ficheiro CSS existente -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Sistema de Gestão Académica</h1>
        <div class="logos">
            <img src="assets/img/logo-senai.png" alt="SENAI" onerror="this.style.display='none'">
            <img src="assets/img/logo-sesi.png" alt="SESI" onerror="this.style.display='none'">
        </div>
    </header>

    <div class="content">
        <!-- Notificações -->
        <div id="alert-box" class="alert"></div>

        <!-- Tela de Login -->
        <div id="view-login">
            <h2 style="margin-bottom: 20px;">Iniciar Sessão</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Utilizador:</label>
                    <input type="text" id="usuario" required placeholder="Digite 'admin'">
                </div>
                <div class="form-group">
                    <label for="senha">Palavra-passe:</label>
                    <input type="password" id="senha" required placeholder="Digite '123'">
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- Dashboard / Painel Principal (Oculto antes do login) -->
        <div id="view-dashboard" class="hidden">
            <nav>
                <button id="btn-tab-admins" class="active" onclick="switchTab('admins')">Administradores</button>
                <button id="btn-tab-cadastros" onclick="switchTab('cadastros')">Cadastros</button>
                <button onclick="logout()" style="background-color: #dc3545; margin-left: auto;">Sair</button>
            </nav>

            <!-- Aba Administradores -->
            <div id="tab-admins">
                <h3>Gestão de Administradores</h3>
                <form id="adminForm" style="margin-top: 15px;">
                    <div class="form-group">
                        <label for="admin-nome">Nome Completo:</label>
                        <input type="text" id="admin-nome" required>
                    </div>
                    <div class="form-group">
                        <label for="admin-email">E-mail:</label>
                        <input type="email" id="admin-email" required>
                    </div>
                    <button type="submit">Adicionar Administrador</button>
                </form>

                <h4 style="margin-top: 25px;">Lista de Administradores</h4>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-admins-body">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Aba Cadastros Geral -->
            <div id="tab-cadastros" class="hidden">
                <h3>Cadastros Gerais</h3>
                <p style="margin-top: 10px;">Módulo de gestão de turmas, alunos e instrutores ativo no localStorage.</p>
            </div>
        </div>
    </div>
</div>

<!-- Importação do Ficheiro JavaScript -->
<script src="assets/js/script.js"></script>

</body>
</html>
